name: Actualiser les News

on:
  schedule:
    - cron: '*/1 * * * *' # S'exécute toutes les 1 minutes
  workflow_dispatch: # Permet de lancer l'action manuellement

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Autorise le robot à sauvegarder le fichier sur le dépôt
      
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Lancer la récupération
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: node fetch-news.js
        
      - name: Sauvegarder le fichier
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add news.json
          git commit -m "Mise à jour auto des actualités" || echo "Aucune nouvelle actualité"
          git push